<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Slash VR</title>
<!-- A-Frame: coba beberapa sumber, terakhir file lokal aframe.min.js (satu folder dengan file ini) -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe.min.js"></script>
<script>window.AFRAME||document.write('<script src="https://aframe.io/releases/1.6.0/aframe.min.js"><\/script>')</script>
<script>window.AFRAME||document.write('<script src="aframe.min.js"><\/script>')</script>
<style>
html,body{margin:0;height:100%;background:#120a1f;touch-action:none}
#trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#err{display:none;position:fixed;inset:0;z-index:9;padding:24px;background:#120a1f;color:#fff;font:16px/1.5 sans-serif}
</style>
<script>
if (!window.AFRAME) {
  document.addEventListener('DOMContentLoaded', () => { document.getElementById('err').style.display = 'block'; });
} else {
const T = AFRAME.THREE;

/* ---------- Suara sederhana (noise burst) ---------- */
let ac;
/* Ledakan bom: dentuman rendah (sine turun) + noise yang meredup */
function boom() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.resume) ac.resume();
    const t = ac.currentTime, dur = 1.1;
    const n = ac.sampleRate * dur | 0, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = ac.createBufferSource(); s.buffer = b;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(80, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(lp); lp.connect(g); g.connect(ac.destination); s.start(t);
    const o = ac.createOscillator(), og = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(30, t + .5);
    og.gain.setValueAtTime(.9, t); og.gain.exponentialRampToValueAtTime(.001, t + .6);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + .6);
  } catch (e) {}
}
function sfx(type) {
  if (type === 'bomb') return boom();
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const n = ac.sampleRate * 0.18 | 0, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = b;
    const f = ac.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = type === 'fuse' ? 6000 : type === 'whoosh' ? 900 : 2200;
    const g = ac.createGain(); g.gain.value = type === 'whoosh' ? 0.05 : type === 'fuse' ? 0.07 : 0.35;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  } catch (e) {}
}

/* ---------- Jarak titik ke segmen (bilah pedang) ---------- */
const _ab = new T.Vector3(), _ap = new T.Vector3(), _c = new T.Vector3();
function segDist(p, a, b) {
  _ab.subVectors(b, a);
  const t = Math.max(0, Math.min(1, _ap.subVectors(p, a).dot(_ab) / (_ab.lengthSq() || 1)));
  return _c.copy(a).addScaledVector(_ab, t).distanceTo(p);
}

/* ---------- Tekstur prosedural (digambar dengan canvas, tanpa file gambar) ---------- */
function cvTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}

/* ---------- Buah: kulit + penampang potongan (semangka, apel, jeruk, lemon, kiwi) ---------- */
function makeFruits() {
  const disc = (c, rings) => rings.forEach(([r, col]) => { c.fillStyle = col; c.beginPath(); c.arc(128, 128, r, 0, 6.283); c.fill(); });
  const spokes = (c, n, r, col, lw) => {
    c.strokeStyle = col; c.lineWidth = lw;
    for (let i = 0; i < n; i++) { const a = i / n * 6.283; c.beginPath(); c.moveTo(128, 128); c.lineTo(128 + Math.cos(a) * r, 128 + Math.sin(a) * r); c.stroke(); }
  };
  const speckle = (c, w, h, n, col, sz) => { c.fillStyle = col; for (let i = 0; i < n; i++) c.fillRect(Math.random() * w, Math.random() * h, sz, sz); };

  const wmSkin = cvTex(256, 128, (c, w, h) => {
    c.fillStyle = '#5cc06a'; c.fillRect(0, 0, w, h); c.fillStyle = '#1f6f31';
    for (let i = 0; i < 8; i++) {
      const x0 = i * w / 8; c.beginPath(); c.moveTo(x0 + 6, 0);
      for (let y = 0; y <= h; y += 4) c.lineTo(x0 + 6 + Math.sin(y * .15 + i) * 5, y);
      for (let y = h; y >= 0; y -= 4) c.lineTo(x0 + 24 + Math.sin(y * .15 + i + 1) * 5, y);
      c.closePath(); c.fill();
    }
  });
  const wmFlesh = cvTex(256, 256, c => {
    disc(c, [[127, '#2b8a3e'], [118, '#e4f3b8'], [110, '#ff6b81'], [70, '#ff3d5f'], [30, '#ff2d55']]);
    c.fillStyle = '#17110f';
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * 6.283 + .15, r = 40 + (i % 2) * 32;
      c.save(); c.translate(128 + Math.cos(a) * r, 128 + Math.sin(a) * r); c.rotate(a);
      c.beginPath(); c.ellipse(0, 0, 8, 4, 0, 0, 6.283); c.fill(); c.restore();
    }
  });
  const apSkin = cvTex(256, 128, (c, w, h) => {
    c.fillStyle = '#d3122b'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 60; i++) { c.fillStyle = `rgba(255,${180 + Math.random() * 60 | 0},60,${.08 + Math.random() * .1})`; c.fillRect(Math.random() * w, 0, 2 + Math.random() * 3, h); }
  });
  const apFlesh = cvTex(256, 256, c => {
    disc(c, [[127, '#c4162b'], [121, '#fff4d2'], [40, '#e9d9a4'], [26, '#fff4d2']]);
    c.fillStyle = '#4a2a14';
    [-8, 8].forEach(x => { c.beginPath(); c.ellipse(128 + x, 128, 4, 8, 0, 0, 6.283); c.fill(); });
  });
  const orSkin = cvTex(256, 128, (c, w, h) => { c.fillStyle = '#ff9a1f'; c.fillRect(0, 0, w, h); speckle(c, w, h, 500, 'rgba(190,90,0,.45)', 1.6); });
  const orFlesh = cvTex(256, 256, c => {
    disc(c, [[127, '#f78a1d'], [119, '#fff1cf'], [111, '#ffa21f']]); spokes(c, 10, 111, '#fff1cf', 4); disc(c, [[10, '#fff1cf']]);
  });
  const lmSkin = cvTex(256, 128, (c, w, h) => { c.fillStyle = '#ffe135'; c.fillRect(0, 0, w, h); speckle(c, w, h, 400, 'rgba(200,160,0,.4)', 1.5); });
  const lmFlesh = cvTex(256, 256, c => {
    disc(c, [[127, '#f2cc1a'], [119, '#fffbe3'], [111, '#fff07a']]); spokes(c, 9, 111, '#fffbe3', 4); disc(c, [[9, '#fffbe3']]);
  });
  const kwSkin = cvTex(256, 128, (c, w, h) => {
    c.fillStyle = '#8b6b42'; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(60,40,20,.5)'; c.lineWidth = 1;
    for (let i = 0; i < 700; i++) { const x = Math.random() * w, y = Math.random() * h; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.random() * 4 - 2, y + Math.random() * 4); c.stroke(); }
  });
  const kwFlesh = cvTex(256, 256, c => {
    disc(c, [[127, '#7a5a35'], [119, '#8fd14f'], [100, '#79c23c']]); spokes(c, 36, 100, 'rgba(190,240,120,.6)', 2); disc(c, [[22, '#f4f8d8']]);
    c.fillStyle = '#111';
    for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283; c.beginPath(); c.ellipse(128 + Math.cos(a) * 38, 128 + Math.sin(a) * 38, 3, 1.8, a, 0, 6.283); c.fill(); }
  });
  // f = warna percikan sari; s = skala; sc = bentuk (lonjong dsb.)
  return [
    { skin: wmSkin, flesh: wmFlesh, f: '#ff4d6d', s: 1.3, sc: [1.12, 1, 1], rough: .4 },
    { skin: apSkin, flesh: apFlesh, f: '#fff1c0', s: 1, sc: [1, .92, 1], rough: .3, deco: 'apple' },
    { skin: orSkin, flesh: orFlesh, f: '#ffb347', s: 1.05, sc: [1, 1, 1], rough: .7, deco: 'orange' },
    { skin: lmSkin, flesh: lmFlesh, f: '#fff07a', s: 1, sc: [1.25, .88, .88], rough: .6, deco: 'lemon' },
    { skin: kwSkin, flesh: kwFlesh, f: '#8fd14f', s: .88, sc: [1.1, .95, .95], rough: .95 }
  ];
}

/* ---------- Latar: dojo di malam hari (langit, bulan, gunung, lentera, kelopak sakura) ---------- */
function buildScenery(root) {
  const B = (g, o) => new T.Mesh(g, new T.MeshBasicMaterial(o));
  const glowTex = cvTex(128, 128, c => {
    const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,240,200,.9)'); g.addColorStop(.3, 'rgba(255,220,160,.3)'); g.addColorStop(1, 'rgba(255,220,160,0)');
    c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  });

  // langit gradasi: gelap di atas, oranye-merah muda di horizon
  root.add(B(new T.SphereGeometry(80, 32, 24), {
    map: cvTex(8, 512, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, 0, h);
      [[0, '#04021a'], [.22, '#150c40'], [.38, '#4a2480'], [.47, '#d9577a'], [.5, '#ffae6b'], [.55, '#3a1a4d'], [1, '#120a1f']]
        .forEach(([p, col]) => g.addColorStop(p, col));
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    }), side: T.BackSide, depthWrite: false
  }));

  // bintang
  const sp = new Float32Array(500 * 3);
  for (let i = 0; i < 500; i++) {
    const th = Math.random() * 6.283, ph = Math.acos(Math.random() * .95 + .05), r = 70;
    sp[i * 3] = r * Math.sin(ph) * Math.cos(th); sp[i * 3 + 1] = r * Math.cos(ph); sp[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.BufferAttribute(sp, 3));
  root.add(new T.Points(sg, new T.PointsMaterial({ color: 0xffffff, size: .6, transparent: true, opacity: .9, depthWrite: false })));

  // bulan + cahaya
  const moon = B(new T.SphereGeometry(4, 24, 16), {
    map: cvTex(128, 64, (c, w, h) => {
      c.fillStyle = '#fff3cf'; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(190,170,130,.35)';
      for (let i = 0; i < 14; i++) { c.beginPath(); c.arc(Math.random() * w, Math.random() * h, 3 + Math.random() * 7, 0, 6.283); c.fill(); }
    })
  });
  moon.position.set(-28, 30, -60); root.add(moon);
  const glow = new T.Sprite(new T.SpriteMaterial({ map: glowTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true }));
  glow.scale.set(26, 26, 1); glow.position.copy(moon.position); root.add(glow);

  // pegunungan berlapis (makin jauh makin terang)
  const mountains = (n, rad, col, hmin, hmax) => {
    for (let i = 0; i < n; i++) {
      const a = i / n * 6.283 + Math.random() * .2, h = hmin + Math.random() * (hmax - hmin), r = h * (.7 + Math.random() * .5);
      const m = B(new T.ConeGeometry(r, h, 5 + (Math.random() * 3 | 0)), { color: col });
      m.position.set(Math.cos(a) * rad, h / 2 - 1, Math.sin(a) * rad); m.rotation.y = Math.random() * 3; root.add(m);
    }
  };
  mountains(26, 60, 0x3a2468, 14, 30); mountains(24, 44, 0x261550, 8, 18); mountains(20, 30, 0x150c30, 4, 9);

  // tanah + panggung kayu
  const ground = B(new T.CircleGeometry(90, 48), { color: 0x0e0818 }); ground.rotation.x = -Math.PI / 2; ground.position.y = -.02; root.add(ground);
  const wood = cvTex(512, 512, (c, w, h) => {
    for (let y = 0; y < h; y += 64) {
      c.fillStyle = `hsl(25,45%,${28 + Math.random() * 10}%)`; c.fillRect(0, y, w, 64);
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 1;
      for (let k = 0; k < 10; k++) {
        const yy = y + 6 + Math.random() * 52; c.beginPath(); c.moveTo(0, yy);
        for (let x = 0; x <= w; x += 32) c.lineTo(x, yy + Math.sin(x * .05 + k) * 2); c.stroke();
      }
    }
  });
  const plat = new T.Mesh(new T.CircleGeometry(5, 48), new T.MeshStandardMaterial({ map: wood, roughness: .8 }));
  plat.rotation.x = -Math.PI / 2; root.add(plat);
  const rim = new T.Mesh(new T.TorusGeometry(5.05, .07, 8, 64), new T.MeshStandardMaterial({ color: 0x8c1d2f, roughness: .6 }));
  rim.rotation.x = Math.PI / 2; rim.position.y = .02; root.add(rim);
  const mark = B(new T.RingGeometry(1.1, 1.2, 48), { color: 0xff5d8f, side: T.DoubleSide }); mark.rotation.x = -Math.PI / 2; mark.position.y = .01; root.add(mark);

  // lentera kertas di tiang
  const lans = [];
  [-60, 60, -120, 120, 180].forEach((deg, i) => {
    const a = deg * Math.PI / 180, x = Math.sin(a) * 4.3, z = -Math.cos(a) * 4.3;
    const pole = new T.Mesh(new T.CylinderGeometry(.04, .05, 2.6, 8), new T.MeshStandardMaterial({ color: 0x3a2312 }));
    pole.position.set(x, 1.3, z); root.add(pole);
    const lan = B(new T.SphereGeometry(.26, 16, 12), { color: 0xff6a2b }); lan.scale.y = 1.25; lan.position.set(x, 2.55, z); root.add(lan); lans.push(lan);
    const gl = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: 0xff8844, blending: T.AdditiveBlending, depthWrite: false, transparent: true }));
    gl.scale.set(1.8, 1.8, 1); gl.position.copy(lan.position); root.add(gl);
    if (i < 2) { const pl = new T.PointLight(0xff9955, .9, 7); pl.position.set(x, 2.4, z); root.add(pl); }
  });

  // kelopak sakura berjatuhan
  const NP = 120, pp = new Float32Array(NP * 3);
  const reset = (i, top) => { pp[i * 3] = (Math.random() - .5) * 10; pp[i * 3 + 1] = top ? 6 : Math.random() * 6; pp[i * 3 + 2] = (Math.random() - .5) * 10 - 1; };
  for (let i = 0; i < NP; i++) reset(i, false);
  const pg = new T.BufferGeometry(); pg.setAttribute('position', new T.BufferAttribute(pp, 3));
  const petals = new T.Points(pg, new T.PointsMaterial({ color: 0xffb7d5, size: .07, transparent: true, opacity: .9, depthWrite: false }));
  petals.frustumCulled = false; root.add(petals);

  return (time, d) => {
    for (let i = 0; i < NP; i++) {
      pp[i * 3 + 1] -= (.25 + (i % 5) * .06) * d;
      pp[i * 3] += Math.sin(time / 900 + i) * .25 * d;
      if (pp[i * 3 + 1] < 0) reset(i, true);
    }
    pg.attributes.position.needsUpdate = true;
    lans.forEach((l, i) => { l.scale.y = 1.25 + .03 * Math.sin(time / 130 + i * 2); });
  };
}

/* ---------- Komponen PEDANG: bilah menyala + jejak tebasan ---------- */
AFRAME.registerComponent('sword', {
  schema: { color: { default: '#4cc9f0' } },
  init() {
    const el = this.el, c = this.c = new T.Color(this.data.color);
    const M = o => new T.MeshBasicMaterial(o);
    // Kemiringan bilah (-0.66 rad ~ -38 derajat). Ubah angka ini kalau arah pedang terasa kurang pas.
    this.g = new T.Group(); this.g.rotation.x = -0.66;
    const add = (geo, mat, z) => { const m = new T.Mesh(geo, mat); m.position.z = z; this.g.add(m); return m; };
    add(new T.BoxGeometry(.035, .012, .9), M({ color: c }), -.6);                // bilah
    add(new T.BoxGeometry(.012, .014, .9), M({ color: 0xffffff }), -.6);          // inti putih
    add(new T.BoxGeometry(.16, .03, .03), M({ color: 0xffd166 }), -.14);          // pelindung tangan
    this.halo = add(new T.BoxGeometry(.09, .05, .95),                             // cahaya berdenyut
      M({ color: c, transparent: true, opacity: .25, blending: T.AdditiveBlending, depthWrite: false }), -.6);
    el.object3D.add(this.g);

    this.lb = new T.Vector3(0, 0, -.15); this.lt = new T.Vector3(0, 0, -1.05);
    this.base = new T.Vector3(); this.tip = new T.Vector3();
    this.pBase = new T.Vector3(); this.pTip = new T.Vector3();
    this.speed = 0; this.cool = 0; this.N = 18; this.hist = [];

    const N = this.N;
    this.pos = new Float32Array(N * 6); this.col = new Float32Array(N * 6);
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(this.pos, 3));
    geo.setAttribute('color', new T.BufferAttribute(this.col, 3));
    const idx = []; for (let i = 0; i < N - 1; i++) { const a = 2 * i; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    geo.setIndex(idx);
    this.trail = new T.Mesh(geo, M({ vertexColors: true, transparent: true, blending: T.AdditiveBlending, side: T.DoubleSide, depthWrite: false }));
    this.trail.frustumCulled = false;
    el.sceneEl.object3D.add(this.trail);

    // matikan garis laser bawaan laser-controls
    el.addEventListener('controllerconnected', () =>
      setTimeout(() => el.setAttribute('raycaster', { showLine: false, objects: '.none' }), 0));
  },
  remove() { this.el.sceneEl.object3D.remove(this.trail); },
  tick(t, dt) {
    const ok = this.el.object3D.visible;
    this.trail.visible = ok;
    if (!ok || !dt) { this.speed = 0; this.hist.length = 0; return; }
    this.g.updateWorldMatrix(true, false);
    this.pBase.copy(this.base); this.pTip.copy(this.tip);
    this.base.copy(this.lb).applyMatrix4(this.g.matrixWorld);
    this.tip.copy(this.lt).applyMatrix4(this.g.matrixWorld);
    const first = !this.hist.length;
    if (first) { this.pBase.copy(this.base); this.pTip.copy(this.tip); }
    this.speed = first ? 0 : this.tip.distanceTo(this.pTip) / (dt / 1000);

    this.hist.push([this.base.clone(), this.tip.clone()]);
    if (this.hist.length > this.N) this.hist.shift();
    const H = this.hist, N = this.N, p = this.pos, k = this.col, c = this.c;
    for (let i = 0; i < N; i++) {
      const h = H[Math.max(0, i - (N - H.length))];
      const f = Math.pow(i / (N - 1), 1.6) * Math.min(1, .35 + this.speed * .12);
      p.set([h[0].x, h[0].y, h[0].z, h[1].x, h[1].y, h[1].z], i * 6);
      k.set([c.r * f, c.g * f, c.b * f, c.r * f, c.g * f, c.b * f], i * 6);
    }
    this.trail.geometry.attributes.position.needsUpdate = true;
    this.trail.geometry.attributes.color.needsUpdate = true;

    // animasi cahaya: berdenyut, melebar saat diayunkan cepat
    this.halo.material.opacity = .2 + .08 * Math.sin(t / 120) + Math.min(.4, this.speed * .05);
    this.halo.scale.x = 1 + Math.min(this.speed, 10) * .12;
    if (this.speed > 3.5 && t > this.cool) { sfx('whoosh'); this.cool = t + 300; }
  }
});

/* ---------- Komponen GAME ---------- */
AFRAME.registerComponent('slice-game', {
  init() {
    this.objs = []; this.now = 0;
    this.S = { score: 0, lives: 5, time: 60, run: false, combo: 0, last: 0, next: 0, best: 0 };
    try { this.S.best = +localStorage.getItem('fs-best') || 0; } catch (e) {}
    const P = Math.PI;
    this.G = {
      s: new T.SphereGeometry(.15, 20, 14),
      top: new T.SphereGeometry(.15, 20, 10, 0, P * 2, 0, P / 2),
      bot: new T.SphereGeometry(.15, 20, 10, 0, P * 2, P / 2, P / 2),
      c: new T.CircleGeometry(.149, 20),
      d: new T.SphereGeometry(.022, 6, 6),
      u: new T.SphereGeometry(1, 10, 8)
    };
    this.F = makeFruits();
    this.ray = new T.Raycaster(); this.pts = []; this.ready = false;
  },

  /* Dipanggil dari tick sampai semua elemen HTML & pedang siap */
  setup() {
    const g = id => document.getElementById(id);
    this.hud = g('hud'); this.menu = g('menu'); this.flash = g('flash'); this.cv = g('trail');
    const sw = [...document.querySelectorAll('[sword]')];
    if (!this.hud || !this.menu || !this.flash || !this.cv || !g('title') || !g('sub') ||
        sw.length < 2 || sw.some(e => !e.components || !e.components.sword)) return false;
    this.ctx = this.cv.getContext('2d');
    this.swords = sw.map(e => e.components.sword);
    sw.forEach(e => e.addEventListener('triggerdown', () => { if (!this.S.run) this.start(); }));
    this.scenery = buildScenery(this.el.object3D);
    this.pointer(); this.showMenu();
    return true;
  },

  /* mouse / sentuhan: seret untuk menebas */
  pointer() {
    const cv = this.cv, rs = () => { cv.width = innerWidth; cv.height = innerHeight; };
    rs(); addEventListener('resize', rs);
    let down = false, pv = null;
    addEventListener('pointerdown', e => { down = true; pv = [e.clientX, e.clientY]; this.pts = []; this.mouse(pv, pv); this.clickBtn(e.clientX, e.clientY); });
    addEventListener('pointerup', () => down = false);
    addEventListener('pointermove', e => {
      if (!down) return;
      const c = [e.clientX, e.clientY];
      this.mouse(pv, c); this.pts.push({ x: c[0], y: c[1], t: performance.now() }); pv = c;
    });
  },
  mouse(a, b) {
    const cam = this.el.camera;
    if (!cam || this.el.is('vr-mode')) return;
    for (let k = 0; k <= 4; k++) {
      const x = a[0] + (b[0] - a[0]) * k / 4, y = a[1] + (b[1] - a[1]) * k / 4;
      this.ray.setFromCamera(new T.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), cam);
      for (const o of this.objs.slice())
        if (o.hit && this.ray.ray.distanceToPoint(o.m.position) < o.r + .03) this.slice(o);
    }
  },

  add(o) { this.el.object3D.add(o.m); this.objs.push(o); },
  rm(o) {
    this.el.object3D.remove(o.m);
    o.m.traverse(n => n.material && n.material.dispose && n.material.dispose());
    const i = this.objs.indexOf(o); if (i > -1) this.objs.splice(i, 1);
  },
  clear() { this.objs.slice().forEach(o => this.rm(o)); },
  hudUp() {
    const S = this.S;
    this.hud.setAttribute('value', S.run ? `Skor ${S.score}   Waktu ${Math.ceil(S.time)}\nNyawa ${S.lives}` + (S.combo > 1 ? `\nCombo x${S.combo}` : '') : '');
  },

  showMenu(txt) {
    this.clear();
    const m = this.makeButton(); m.position.set(0, 1.4, -1.4);
    this.add({ m, v: new T.Vector3(), sp: new T.Vector3(), kind: 'start', r: 0, hit: false, g: 0 });
    this.btn = m;
    this.menu.setAttribute('visible', true);
    document.getElementById('sub').setAttribute('value',
      txt || 'Tekan tombol MULAI\nKontroler VR: tekan trigger atau sentuh tombol dengan pedang\nDesktop / HP: klik atau ketuk tombol');
    this.hudUp();
  },
  start() {
    const S = this.S;
    this.btn = null; this.clear(); Object.assign(S, { score: 0, lives: 5, time: 60, run: true, combo: 0, next: this.now + 700 });
    this.menu.setAttribute('visible', false); this.hudUp(); sfx('cut');
  },
  end() {
    const S = this.S; S.run = false; S.best = Math.max(S.best, S.score);
    try { localStorage.setItem('fs-best', S.best); } catch (e) {}
    document.getElementById('title').setAttribute('value', S.lives <= 0 ? 'GAME OVER' : 'WAKTU HABIS!');
    this.showMenu(`Skor: ${S.score}    Terbaik: ${S.best}\nTekan tombol MULAI untuk main lagi`);
  },

  /* Tombol MULAI 3D (teks digambar di canvas) */
  makeButton() {
    const face = new T.MeshBasicMaterial({ transparent: true, map: cvTex(512, 160, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#2ee59d'); g.addColorStop(1, '#0a9f6a');
      c.fillStyle = g; c.beginPath();
      if (c.roundRect) c.roundRect(4, 4, w - 8, h - 8, 36); else c.rect(4, 4, w - 8, h - 8);
      c.fill(); c.lineWidth = 8; c.strokeStyle = '#ffffff'; c.stroke();
      c.font = 'bold 84px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = 'rgba(0,0,0,.3)'; c.fillText('MULAI', w / 2 + 4, h / 2 + 6);
      c.fillStyle = '#fff'; c.fillText('MULAI', w / 2, h / 2 + 2);
    }) });
    const side = new T.MeshStandardMaterial({ color: 0x0a7a52, roughness: .5 });
    return new T.Mesh(new T.BoxGeometry(1, .32, .08), [side, side, side, side, face, side]);
  },
  /* Klik / ketuk tombol dengan mouse atau jari */
  clickBtn(x, y) {
    const cam = this.el.camera;
    if (this.S.run || !this.btn || !cam || this.el.is('vr-mode')) return;
    this.ray.setFromCamera(new T.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), cam);
    if (this.ray.ray.intersectsBox(new T.Box3().setFromObject(this.btn).expandByScalar(.03))) this.start();
  },

  /* Buah utuh: kulit bertekstur + hiasan (tangkai apel, daun, ujung lemon) */
  fruitMesh(t, mul = 1) {
    const w = new T.Group(), s = t.s * mul, sc = t.sc;
    const std = c => new T.MeshStandardMaterial({ color: c, roughness: .8 });
    const body = new T.Mesh(this.G.s, new T.MeshStandardMaterial({ map: t.skin, roughness: t.rough, metalness: 0 }));
    body.scale.set(s * sc[0], s * sc[1], s * sc[2]); w.add(body);
    const top = .15 * sc[1] * s;
    if (t.deco === 'apple') {
      const st = new T.Mesh(new T.CylinderGeometry(.006 * s, .008 * s, .06 * s, 6), std(0x5a3a1a)); st.position.y = top + .005; w.add(st);
      const lf = new T.Mesh(this.G.u, std(0x3fae49)); lf.scale.set(.05 * s, .008 * s, .025 * s);
      lf.position.set(.035 * s, top + .03 * s, 0); lf.rotation.z = .4; w.add(lf);
    } else if (t.deco === 'orange') {
      const nb = new T.Mesh(this.G.u, std(0x3a8f3a)); nb.scale.set(.02 * s, .01 * s, .02 * s); nb.position.y = top; w.add(nb);
    } else if (t.deco === 'lemon') {
      [1, -1].forEach(k => {
        const nb = new T.Mesh(this.G.u, std(0xe0b800)); nb.scale.setScalar(.02 * s);
        nb.position.x = k * .15 * sc[0] * s; w.add(nb);
      });
    }
    return w;
  },
  /* Setengah buah dengan penampang (daging, biji, kulit putih) */
  halfMesh(t, up) {
    const g = new T.Group(), h = new T.Group();
    h.add(new T.Mesh(up ? this.G.top : this.G.bot, new T.MeshStandardMaterial({ map: t.skin, roughness: t.rough, side: T.DoubleSide })),
          new T.Mesh(this.G.c, new T.MeshBasicMaterial({ map: t.flesh, transparent: true, side: T.DoubleSide })).rotateX(-Math.PI / 2));
    h.scale.set(t.s * t.sc[0], t.s * t.sc[1], t.s * t.sc[2]); g.add(h);
    return g;
  },

  /* Bentuk bom: badan hitam mengilap, tutup logam, sumbu, percikan api, garis merah */
  makeBomb() {
    const g = new T.Group();
    g.add(new T.Mesh(this.G.s, new T.MeshStandardMaterial({ color: 0x111111, roughness: .25, metalness: .6 })));
    const cap = new T.Mesh(new T.CylinderGeometry(.045, .055, .05, 12),
      new T.MeshStandardMaterial({ color: 0x666666, metalness: .8, roughness: .3 }));
    cap.position.y = .15;
    const fuse = new T.Mesh(new T.CylinderGeometry(.008, .008, .12, 6), new T.MeshBasicMaterial({ color: 0xc9a66b }));
    fuse.position.set(.025, .22, 0); fuse.rotation.z = -.5;
    const spark = new T.Mesh(new T.SphereGeometry(.03, 8, 8), new T.MeshBasicMaterial({ color: 0xffaa00 }));
    spark.position.set(.054, .28, 0);
    const band = new T.Mesh(new T.TorusGeometry(.15, .008, 8, 24), new T.MeshBasicMaterial({ color: 0xff2200 }));
    band.rotation.x = Math.PI / 2;
    g.add(cap, fuse, spark, band);
    return { g, spark };
  },

  launch() {
    const n = 1 + (Math.random() < .45) + (Math.random() < .15);
    for (let i = 0; i < n; i++) {
      const bomb = this.S.score >= 40 && Math.random() < .18, t = this.F[Math.random() * this.F.length | 0];
      let m, spark;
      if (bomb) { const b = this.makeBomb(); m = b.g; spark = b.spark; sfx('fuse'); }
      else m = this.fruitMesh(t);
      const x = (Math.random() - .5) * 1.7;
      m.position.set(x, .3, -1.0 - Math.random() * .5);
      this.add({ m, v: new T.Vector3(-x * .45 + (Math.random() - .5) * .4, 3.7 + Math.random() * .6, Math.random() * .3),
        sp: bomb ? new T.Vector3(0, 2, 0) : new T.Vector3(Math.random() * 4, Math.random() * 4, Math.random() * 4),
        kind: bomb ? 'bomb' : 'fruit', r: bomb ? .15 : .15 * Math.max(...t.sc) * t.s, t, hit: true, g: 1, spark });
    }
  },

  burst(p, color, n) {
    const mat = new T.MeshBasicMaterial({ color });
    for (let i = 0; i < n; i++) {
      const m = new T.Mesh(this.G.d, mat); m.position.copy(p);
      this.add({ m, v: new T.Vector3(Math.random() - .5, Math.random() * .8, Math.random() - .5).multiplyScalar(2.4),
        sp: new T.Vector3(), kind: 'drop', g: 1, ttl: .6, hit: false, r: 0 });
    }
  },

  slice(o) {
    if (!this.objs.includes(o)) return;
    const S = this.S, p = o.m.position.clone();
    this.rm(o);
    if (o.kind === 'start') { this.burst(p, o.t.f, 12); sfx('cut'); this.start(); return; }
    if (o.kind === 'bomb') {
      sfx('bomb'); this.burst(p, '#ff7700', 16); S.lives--; S.combo = 0;
      this.flash.setAttribute('animation__f', 'property:material.opacity;from:.5;to:0;dur:450;easing:easeOutQuad');
      this.hudUp(); if (S.lives <= 0) this.end(); return;
    }
    sfx('cut'); this.burst(p, o.t.f, 8);
    const now = performance.now();
    S.combo = now - S.last < 600 ? S.combo + 1 : 1; S.last = now;
    S.score += 10 + (S.combo > 1 ? S.combo * 5 : 0);
    for (const s of [1, -1]) {
      const g = this.halfMesh(o.t, s > 0);
      g.position.copy(p); g.rotation.z = Math.random() * 6.28;
      this.add({ m: g, v: new T.Vector3(s * .9 + o.v.x * .3, o.v.y * .2 + (s > 0 ? .7 : -.2), o.v.z),
        sp: new T.Vector3(Math.random() * 6, Math.random() * 6, Math.random() * 6), kind: 'half', g: 1, ttl: 1.3, hit: false, r: 0 });
    }
    this.hudUp();
  },

  tick(time, dt) {
    if (!dt) return;
    if (!this.ready) { this.ready = this.setup(); return; }
    this.now = time;
    const d = Math.min(dt, 50) / 1000, S = this.S;
    if (this.scenery) this.scenery(time, d);

    if (S.run) {
      const prev = Math.ceil(S.time); S.time -= d;
      if (S.time <= 0) { S.time = 0; this.end(); return; }
      if (Math.ceil(S.time) !== prev) this.hudUp();
    }
    if (S.run && time > S.next) { this.launch(); S.next = time + Math.max(550, 1400 - S.score * 5); }

    // fisika
    for (let i = this.objs.length - 1; i >= 0; i--) {
      const o = this.objs[i], m = o.m;
      o.v.y -= 6 * o.g * d;
      m.position.addScaledVector(o.v, d);
      m.rotation.x += o.sp.x * d; m.rotation.y += o.sp.y * d; m.rotation.z += o.sp.z * d;
      if (o.spark) o.spark.scale.setScalar(1 + .5 * Math.sin(time / 50));
      if (o.ttl !== undefined) {
        o.ttl -= d;
        if (o.ttl < .25) m.scale.setScalar(Math.max(.01, o.ttl * 4));
        if (o.ttl <= 0) { this.rm(o); continue; }
      }
      if ((o.kind === 'fruit' || o.kind === 'bomb') && o.v.y < 0 && m.position.y < .05) {
        this.rm(o); // buah jatuh dibiarkan hilang, nyawa tidak berkurang
      }
    }

    // tebasan pedang VR
    for (const s of this.swords) {
      if (s.speed < 1.5) continue;
      for (const o of this.objs.slice()) {
        if (!o.hit) continue;
        const p = o.m.position;
        if (Math.min(segDist(p, s.base, s.tip), segDist(p, s.pBase, s.pTip)) < o.r + .035) this.slice(o);
      }
    }

    // tombol MULAI: berdenyut pelan, bisa disentuh pedang VR
    if (!S.run && this.btn) {
      this.btn.scale.setScalar(1 + .03 * Math.sin(time / 250));
      for (const s of this.swords) {
        if (s.speed > 1 && Math.min(segDist(this.btn.position, s.base, s.tip), segDist(this.btn.position, s.pBase, s.pTip)) < .4) { this.start(); break; }
      }
    }

    // jejak mouse / jari
    const c = this.ctx, now = performance.now();
    c.clearRect(0, 0, this.cv.width, this.cv.height);
    this.pts = this.pts.filter(p => now - p.t < 250);
    c.lineCap = 'round';
    for (let i = 1; i < this.pts.length; i++) {
      const a = this.pts[i - 1], b = this.pts[i], f = 1 - (now - b.t) / 250;
      c.strokeStyle = `rgba(180,240,255,${f})`; c.lineWidth = 2 + 10 * f;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    }
  }
});
}
</script>
</head>
<body>
<div id="err">
  <h2>A-Frame gagal dimuat</h2>
  <p>Unduh <b>https://aframe.io/releases/1.6.0/aframe.min.js</b>, simpan sebagai <b>aframe.min.js</b> di folder yang sama dengan file ini, lalu refresh (Ctrl+Shift+R).</p>
</div>
<canvas id="trail"></canvas>

<a-scene slice-game renderer="antialias:true" vr-mode-ui="enabled:true" webxr="optionalFeatures:hand-tracking">
  <!-- Langit, gunung, panggung, lentera dibuat lewat buildScenery() di skrip -->
  <a-entity light="type:ambient;color:#c9b8ff;intensity:0.9"></a-entity>
  <a-entity light="type:directional;color:#ffe9c8;intensity:1.1" position="1 4 2"></a-entity>

  <a-entity id="rig">
    <a-entity camera look-controls="mouseEnabled:false;touchEnabled:false;pointerLockEnabled:false" wasd-controls="enabled:false" position="0 1.6 0">
      <a-plane id="flash" position="0 0 -0.3" width="2" height="2" material="shader:flat;color:#ff0000;transparent:true;opacity:0;depthTest:false"></a-plane>
      <a-text id="hud" value="" position="0 0.5 -1.3" align="center" width="1.4" color="#ffffff"></a-text>
    </a-entity>
    <a-entity laser-controls="hand:left" sword="color:#4cc9f0"></a-entity>
    <a-entity laser-controls="hand:right" sword="color:#ff5d8f"></a-entity>
  </a-entity>

  <a-entity id="menu">
    <a-text id="title" value="FRUIT SLASH" align="center" width="3.2" color="#ffd166" position="0 2.15 -1.4"></a-text>
    <a-text id="sub" value="" align="center" width="1.9" color="#ffffff" position="0 0.8 -1.4"></a-text>
  </a-entity>
</a-scene>
</body>
</html>
